name: PurffleShorts

on:
  workflow_dispatch:
  schedule:
    # 10:00 AM Pacific
    - cron: "0 10 * * *"
      timezone: "America/Los_Angeles"

    # 3:00 PM Pacific
    - cron: "0 15 * * *"
      timezone: "America/Los_Angeles"

    # 8:00 PM Pacific
    - cron: "0 20 * * *"
      timezone: "America/Los_Angeles"

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install PurffleShorts
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Install FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Restore YouTube authorization
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          echo "$YOUTUBE_TOKEN_JSON" | base64 --decode > token.json

      - name: Generate and upload Short
        env:
          LLM_PROVIDER: gemini
          LLM_MODEL: gemini-2.5-flash
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YT_TOKEN_FILE: token.json
          PYTHONUTF8: "1"
          YT_PRIVACY: public
          SYNTHETIC_MEDIA: "true"
        run: |
          purffle-shorts make \
            --source niche \
            --niche "AI tools, artificial intelligence, technology, money-saving tech, useful websites and apps" \
            --style listicle \
            --duration 30 \
            --visuals pixabay